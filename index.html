<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Para los Reyes Magos</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(#0b3d2e, #145a32);
            color: white;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 30px;
        }

        .navidad {
            position: absolute;
            top: 10px;
            width: 100%;
            font-size: 2em;
        }

        .contenedor {
            background: rgba(0, 0, 0, 0.4);
            padding: 30px;
            border-radius: 20px;
            border: 3px solid red;
        }

        .advertencia {
            color: yellow;
            font-size: 1.3em;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .flecha {
            font-size: 3em;
            margin: 10px 0;
        }

        a {
            display: inline-block;
            margin-top: 10px;
            padding: 15px 25px;
            background: red;
            color: white;
            text-decoration: none;
            font-size: 1.2em;
            border-radius: 10px;
            font-weight: bold;
        }

        a:hover {
            background: darkred;
        }

        .decoracion {
            position: absolute;
            bottom: 10px;
            font-size: 2em;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="navidad">🎄🎅✨ 🎁 ❄️ ⭐</div>

    <h1>Para los Reyes Magos 👑👑👑</h1>

    <div class="contenedor">
        <div class="advertencia">⚠️ ADVERTENCIA: REGALO DESEADO ⚠️</div>
        <div class="flecha">⬇️⬇️⬇️</div>
        <a href="https://www.mercadolibre.com.mx/p/MLM19610178?pdp_filters=item_id:MLM2610463427#origin=share&sid=share&wid=MLM2610463427&action=whatsapp" target="_blank">
            🎁 Ver regalo aquí 🎁
        </a>
    </div>

    <div class="decoracion">🎄 ❄️ 🎁 ⭐ 🎅 🎄</div>

</body>
</html>
